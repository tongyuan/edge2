<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b10" />
    <title>EDGE Intel · Dock</title>
    <link rel="stylesheet" href="/static/workspace.css?v=unified-docking-20261115" />
    <link rel="stylesheet" href="/static/opportunity-map.css?v=unified-docking-20261115" />
    <link rel="stylesheet" href="/static/dock-workspace.css?v=unified-docking-20261115" />
  </head>
  <body class="dock-body">
    <main class="dock-shell">
      <section id="dockOpportunityMap" class="dock-opportunity-map" hidden></section>
      <section id="dockInbox" class="dock-inbox" hidden>
        <header class="dock-header"><div><p>DELIVERY HISTORY</p><h1>Notification Inbox</h1><span id="notificationInboxSummary">No unread notifications</span></div><button class="quiet-button" id="dockReturnToEdge" type="button">Return to EDGE</button></header>
        <p class="notification-inbox-empty" id="notificationInboxEmpty">No active notifications.</p>
        <ul class="notification-inbox-list" id="notificationInboxList" aria-live="polite"></ul>
        <footer><button class="quiet-button" type="button" id="notificationMarkAllRead" disabled>Mark all read</button><button class="danger-button" type="button" id="notificationClearInbox" disabled>Clear inbox</button></footer>
      </section>
    </main>
    <script src="/static/operator-time.js?v=unified-docking-20261115" defer></script>
    <script src="/static/docking.js?v=unified-docking-20261115" defer></script>
    <script src="/static/opportunity-map.js?v=unified-docking-20261115" defer></script>
    <script src="/static/notifications.js?v=unified-docking-20261115" defer></script>
    <script src="/static/dock-workspace.js?v=unified-docking-20261115" defer></script>
  </body>
</html>
