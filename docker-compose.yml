name: edge2

services:
  edge2-db:
    image: postgres:16-alpine
    container_name: edge2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EDGE2_DB_NAME:-edge2}
      POSTGRES_USER: ${EDGE2_DB_USER:-edge2}
      POSTGRES_PASSWORD: ${EDGE2_DB_PASSWORD:?EDGE2_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${EDGE2_DB_PORT:-5435}:5432"
    volumes:
      - edge2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDGE2_DB_USER:-edge2} -d ${EDGE2_DB_NAME:-edge2}"]
      interval: 5s
      timeout: 5s
      retries: 20

  edge2-app:
    container_name: edge2-app
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    restart: unless-stopped
    env_file:
      - ${EDGE2_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${EDGE2_DB_USER:-edge2}:${EDGE2_DB_PASSWORD}@edge2-db:5432/${EDGE2_DB_NAME:-edge2}
      PORT: "8790"
    ports:
      - "127.0.0.1:${EDGE2_APP_PORT:-8792}:8790"
    depends_on:
      edge2-db:
        condition: service_healthy

  edge2-ingress:
    image: nginx:stable-alpine
    container_name: edge2-ingress
    restart: unless-stopped
    environment:
      EDGE2_UPSTREAM_WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      NGINX_ENVSUBST_FILTER: ^EDGE2_UPSTREAM_WEBHOOK_SECRET$
    ports:
      - "127.0.0.1:${EDGE2_INGRESS_PORT:-8793}:8080"
    volumes:
      - ./infra/nginx/edge2-ngrok.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      edge2-app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  edge2_pgdata:
    name: edge2_pgdata
